name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Rust and Neovim smoke tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Rust
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked
      - name: Run Neovim smoke tests
        env:
          NVIM_VERSION: v0.11.6
          NVIM_SHA256: 2fc90b962327f73a78afbfb8203fd19db8db9cdf4ee5e2bef84704339add89cc
        run: |
          archive="$RUNNER_TEMP/nvim-linux-x86_64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          printf '%s  %s\n' "$NVIM_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --headless -u NONE -i NONE -l tests/smoke.lua
