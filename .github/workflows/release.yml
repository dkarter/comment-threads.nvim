name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag of an existing draft release to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      commit: ${{ steps.draft.outputs.commit }}
    steps:
      - id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          skip-github-pull-request: true
      - id: draft
        if: steps.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name || inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish --jq 'select(.isDraft) | .targetCommitish')
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.prepare.outputs.tag }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Install target
        run: |
          if [[ "$TARGET" == *-linux-musl ]]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
            echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
            target_env=${TARGET^^}
            echo "CARGO_TARGET_${target_env//-/_}_LINKER=musl-gcc" >> "$GITHUB_ENV"
          fi
          rustup target add "$TARGET"
      - name: Build and test
        run: |
          cargo build --locked --release --target "$TARGET"
          mkdir -p dist
          cp "target/$TARGET/release/comment-threads" "dist/comment-threads-$TARGET"
          bin="dist/comment-threads-$TARGET"
          test "$("$bin" --version)" = "comment-threads ${TAG#v}"
          root=$(mktemp -d)
          export XDG_DATA_HOME="$root/data"
          printf 'example\n' > "$root/sample.txt"
          "$bin" --root "$root" create --author CI <<'JSON'
          {"path":"sample.txt","body":"Smoke test","anchor":{"kind":"line","quote":"example","prefix":"","suffix":"","digest":"","offset":0,"line":0}}
          JSON
          "$bin" --root "$root" list | jq -e '.[0].messages[0].body == "Smoke test"'
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/comment-threads-${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comment-threads-${{ matrix.target }}
          path: dist/comment-threads-${{ matrix.target }}
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: comment-threads-*
          path: dist
          merge-multiple: true
      - name: Upload and verify draft assets
        run: |
          assets=(
            dist/comment-threads-aarch64-apple-darwin
            dist/comment-threads-aarch64-unknown-linux-musl
            dist/comment-threads-x86_64-apple-darwin
            dist/comment-threads-x86_64-unknown-linux-musl
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          expected=$(sha256sum "${assets[@]}" | jq -Rsc '
            split("\n") | map(select(length > 0) | split("  ") |
            {name: (.[1] | ltrimstr("dist/")), digest: ("sha256:" + .[0])}) |
            sort_by(.name)')
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)
          jq -e --arg commit "$COMMIT" '.isDraft and .targetCommitish == $commit' <<<"$draft"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,assets)
          jq -e --arg commit "$COMMIT" --argjson expected "$expected" '
            .isDraft and .targetCommitish == $commit and
            ([.assets[] | {name, digest}] | sort_by(.name)) == $expected
          ' <<<"$draft"
      - name: Publish the verified draft
        run: |
          # GitHub creates the version tag from the draft's commit at publication.
          existing_tag=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG")
          test -z "$existing_tag"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable |
            jq -e '(.isDraft == false) and .isImmutable'

  release-pr:
    needs: [prepare, publish]
    # On ordinary pushes there may be no draft to build or publish.
    if: >-
      !cancelled() &&
      needs.prepare.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check the release baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read the same branch as Release Please, not the workflow event's SHA.
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json?ref=main" \
            -H 'Accept: application/vnd.github.raw+json' | jq -er '.["."]')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version in the release manifest: $version"
            exit 1
          fi
          # The version tag is created only when the draft is published.
          # A previous run may have left a draft even if this run had no work.
          tag=$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/v$version")
          published=false
          if [[ -n "$tag" ]]; then
            published=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft | not')
          fi
          if [[ "$published" != true ]]; then
            echo "::notice::Waiting for v$version to be published before generating a release PR."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Update the release PR
        if: steps.baseline.outputs.ready == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          skip-github-release: true
