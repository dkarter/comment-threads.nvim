name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag of an existing draft release to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      commit: ${{ steps.draft.outputs.commit }}
    steps:
      - id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      - id: draft
        if: steps.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name || inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish --jq 'select(.isDraft) | .targetCommitish')
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.prepare.outputs.tag }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Install target
        run: |
          if [[ "$TARGET" == *-linux-musl ]]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
            echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
            target_env=${TARGET^^}
            echo "CARGO_TARGET_${target_env//-/_}_LINKER=musl-gcc" >> "$GITHUB_ENV"
          fi
          rustup target add "$TARGET"
      - name: Build and test
        run: |
          cargo build --locked --release --target "$TARGET"
          mkdir -p dist
          cp "target/$TARGET/release/comment-threads" "dist/comment-threads-$TARGET"
          bin="dist/comment-threads-$TARGET"
          test "$("$bin" --version)" = "comment-threads ${TAG#v}"
          root=$(mktemp -d)
          export XDG_DATA_HOME="$root/data"
          printf 'example\n' > "$root/sample.txt"
          "$bin" --root "$root" create --author CI <<'JSON'
          {"path":"sample.txt","body":"Smoke test","anchor":{"kind":"line","quote":"example","prefix":"","suffix":"","digest":"","offset":0,"line":0}}
          JSON
          "$bin" --root "$root" list | jq -e '.[0].messages[0].body == "Smoke test"'
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/comment-threads-${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comment-threads-${{ matrix.target }}
          path: dist/comment-threads-${{ matrix.target }}
          if-no-files-found: error
          overwrite: true

  attach:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: comment-threads-*
          path: dist
          merge-multiple: true
      - name: Attach binaries to draft
        run: |
          commit=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish --jq 'select(.isDraft) | .targetCommitish')
          test "$commit" = "$COMMIT"
          assets=(dist/comment-threads-*)
          test "${#assets[@]}" -eq 4
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          echo "Binaries are attached to $TAG. Publish the draft after confirming release immutability is enabled." >> "$GITHUB_STEP_SUMMARY"
